name: Qualité

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Récupération du dépôt
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Dépendances
      run: npm ci

    # lint, vérification des types et tests des fonctions pures du pipeline
    - name: Qualité
      run: npm run quality

    - name: Build
      run: npm run build
